# Deployment auf den Hetzner-Server (ohne Docker):
#   Tests -> Build (Next.js standalone) auf GitHub -> Upload per SSH als deploy-meetings nach
#   /srv/meetings/releases/<Zeitstempel> -> current umschalten -> sudo systemctl restart meetings
#   -> Health-Check (bei Fehler automatisch zurück auf das vorige Release).
#
# Benötigt im Repository (Settings -> Secrets and variables -> Actions):
#   Secret   DEPLOY_SSH_KEY      privater SSH-Schlüssel von deploy-meetings
#   Variable DEPLOY_KNOWN_HOSTS  Host-Schlüssel des Servers (ssh-keyscan -t ed25519 2.31.52.105)
# Datenbank-Migrationen laufen getrennt (npm run supabase:migrate), vor dem Merge nach main.
name: Deploy

on:
  push:
    branches: [main]
  pull_request:          # nur Tests, kein Deployment
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  test:
    name: Tests
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: terminbuchung_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/terminbuchung_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - name: Unit- und DB-Tests
        run: |
          export ENCRYPTION_KEY="$(node -e 'console.log(require("crypto").randomBytes(32).toString("base64"))')"
          npm test

  deploy:
    name: Build und Deployment
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    environment:
      name: production
      url: https://meetings.atools.de
    env:
      DEPLOY_HOST: 2.31.52.105
      DEPLOY_USER: deploy-meetings
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund

      - name: Build
        env:
          # wird beim Build geprüft (kein Pfad erlaubt); Laufzeitwerte kommen aus /etc/meetings/env
          APP_BASE_URL: https://meetings.atools.de
          NEXT_TELEMETRY_DISABLED: "1"
        run: npm run build

      - name: Release zusammenstellen
        run: |
          set -euo pipefail
          REL=release
          cp -a .next/standalone "$REL"
          cp -a .next/static "$REL/.next/static"
          if [ -d public ]; then cp -a public "$REL/public"; fi
          install -D -m 0755 deploy/activate.sh "$REL/deploy/activate.sh"
          # Laufzeit-Cache außerhalb des schreibgeschützten Releases (systemd: CacheDirectory=meetings)
          rm -rf "$REL/.next/cache" && ln -s /var/cache/meetings "$REL/.next/cache"
          # niemals Umgebungsdateien mitliefern
          find "$REL" -maxdepth 1 -name '.env*' -delete
          echo "$GITHUB_SHA" > "$REL/REVISION"
          test -f "$REL/server.js"
          tar -czf release.tgz -C "$REL" .
          echo "RELEASE=$(date -u +%Y%m%d%H%M%S)" >> "$GITHUB_ENV"
          du -h release.tgz

      - name: SSH vorbereiten
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ vars.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          if [ -z "$DEPLOY_SSH_KEY" ]; then echo "::error::Secret DEPLOY_SSH_KEY fehlt"; exit 1; fi
          if [ -z "$DEPLOY_KNOWN_HOSTS" ]; then echo "::error::Variable DEPLOY_KNOWN_HOSTS fehlt (ssh-keyscan -t ed25519 $DEPLOY_HOST)"; exit 1; fi
          install -d -m 0700 ~/.ssh
          # Schlüssel normalisieren: Windows-Zeilenenden entfernen, verlorene Zeilenumbrüche
          # wiederherstellen (Schlüssel in einer Zeile), abschließender Zeilenumbruch
          (umask 077; python3 - > ~/.ssh/deploy_key <<'PY'
          import os, re, textwrap
          k = os.environ["DEPLOY_SSH_KEY"].replace("\r", "").strip()
          m = re.fullmatch(r"(-----BEGIN [A-Z ]+-----)\s*(.*?)\s*(-----END [A-Z ]+-----)", k, re.S)
          if m:
              body = re.sub(r"\s+", "", m.group(2))
              k = "\n".join([m.group(1), *textwrap.wrap(body, 70), m.group(3)])
          print(k)
          PY
          )
          if ! ssh-keygen -y -P "" -f ~/.ssh/deploy_key > /tmp/deploy_key.pub 2> /tmp/deploy_key.err; then
            if grep -q "PuTTY-User-Key-File" ~/.ssh/deploy_key; then
              echo "::error::DEPLOY_SSH_KEY ist im PuTTY-Format (.ppk). Bitte als OpenSSH-Schlüssel exportieren (PuTTYgen: Conversions -> Export OpenSSH key)."
            elif grep -qE "^(ssh-ed25519|ssh-rsa|ecdsa-)" ~/.ssh/deploy_key; then
              echo "::error::DEPLOY_SSH_KEY enthält einen ÖFFENTLICHEN Schlüssel. Ins Secret gehört der private (-----BEGIN OPENSSH PRIVATE KEY----- …)."
            elif grep -qiE "passphrase" /tmp/deploy_key.err || grep -q "ENCRYPTED" ~/.ssh/deploy_key; then
              echo "::error::DEPLOY_SSH_KEY ist mit einer Passphrase geschützt. Für das Deployment wird ein Schlüssel ohne Passphrase benötigt."
            elif ! grep -q "^-----BEGIN .*PRIVATE KEY-----" ~/.ssh/deploy_key; then
              echo "::error::DEPLOY_SSH_KEY beginnt nicht mit -----BEGIN … PRIVATE KEY-----. Bitte die komplette Schlüsseldatei inkl. Kopf- und Fußzeile eintragen."
            else
              echo "::error::DEPLOY_SSH_KEY lässt sich nicht als privater SSH-Schlüssel lesen (unvollständig oder beschädigt)."
            fi
            exit 1
          fi
          echo "Deploy-Schlüssel: $(ssh-keygen -lf /tmp/deploy_key.pub)"
          echo "Muss zu einem Eintrag in /home/deploy-meetings/.ssh/authorized_keys passen (ssh-keygen -lf …)."
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          cat > ~/.ssh/config <<CFG
          Host meetings-server
            HostName $DEPLOY_HOST
            User $DEPLOY_USER
            IdentityFile ~/.ssh/deploy_key
            IdentitiesOnly yes
            StrictHostKeyChecking yes
            BatchMode yes
            ServerAliveInterval 15
          CFG

      - name: Hochladen nach /srv/meetings/releases/<Zeitstempel>
        run: |
          ssh meetings-server "umask 027 && mkdir /srv/meetings/releases/$RELEASE && tar -xzf - -C /srv/meetings/releases/$RELEASE" < release.tgz

      - name: Umschalten, Neustart, Health-Check
        run: |
          ssh meetings-server "bash /srv/meetings/releases/$RELEASE/deploy/activate.sh $RELEASE"

      - name: Aufräumen
        if: always()
        run: rm -f ~/.ssh/deploy_key
